<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="signin.css">
  <link rel="stylesheet" href="home.html">
  <link rel="stylesheet" href="signup.html">
</head>
<body>
  <div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="branding">
        <h1>Welcome back!</h1>
        <div class="logo">
          <img src="img/login.jpg" alt="Time2Dine Logo">
        </div>
      </div>
    </div>

    <!-- Right Panel -->

    <div class="right-panel">
      <a href="home.html" class="back">&larr; Back</a>
      <h2>Sign In with</h2>

      <form class="login-form">
        <div class="input-group">
          <label for="username"> Email address or username</label>
          <input type="text" placeholder="Type here">
        </div>
        <div class="input-group">
          <label for="password"> Password</label>
          <input type="password" placeholder="******************" required>
          <span class="toggle-password">👁</span>
        </div>
        <p class="signup-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
        <br>
        <button type="submit" class="signin-btn"><a href="home.html">Sign In</a></button>
      </form>

      



    </div>
  </div>
</body>
</html>
