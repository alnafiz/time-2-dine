<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="branding">
        <h1>Welcome back!</h1>
        <div class="logo">
          <img src="img/login.jpg" alt="Time2Dine Logo">
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <a href="home.html" class="back">&larr; Back</a>
      <h2>Create Account</h2>

      <form class="signup-form">
        <div class="input-group">
          <input type="text" placeholder="Full Name" required>
        </div>
        <div class="input-group">
          <input type="email" placeholder="Email Address" required>
        </div>
        <div class="input-group password-group">
          <input type="password" placeholder="Password" required>
          <span class="toggle-password">👁</span>
        </div>

        <button type="submit" class="signup-btn"><a href="home.html" class="signup-btn">Create Account</a></button>
      </form>
      <p class="login-text">Already have an account? <a href="signin.html">Log in</a></p>

    </div>
  </div>
</body>
</html>
